name: Smalt
description: >-
  Smalt is a Berlin-based training academy and technology platform for the green-energy
  installation trades. It combines a B2B installation services business (solar and, increasingly, heat
  pumps and other climate-trade work) with an education platform that upskills and certifies installers,
  plus a franchise model that lets trained installers run their own training businesses on Smalt's learning
  materials and tooling. Founded in 2023 and backed by General Catalyst, noa, Owl Ventures, Heartfelt, La
  Famiglia and Loric Ventures, Smalt is a workforce/services company rather than an API provider; as of
  this enrichment pass it publishes no public API, developer portal, OpenAPI, or SDK surface to catalog.
